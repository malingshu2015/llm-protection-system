<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模态框测试</title>
    <style>
        :root {
            --primary-color: #007AFF;
            --surface-color: #FFFFFF;
            --surface-secondary: #F2F2F7;
            --text-primary: #000000;
            --text-secondary: #8E8E93;
            --border-color: #C6C6C8;
            --radius-lg: 12px;
            --radius-sm: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f7;
        }

        .test-button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }

        .test-button:hover {
            background: #0056CC;
        }

        /* 规则编辑模态框样式 */
        .rule-edit-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
        }
        
        .rule-edit-modal.show {
            display: flex !important;
        }

        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .modal-container {
            position: relative;
            background: var(--surface-color);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
            background: var(--surface-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-close-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .modal-close-btn:hover {
            background: rgba(0, 0, 0, 0.1);
            color: var(--text-primary);
        }

        .modal-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            background: var(--surface-secondary);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            border: none;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-secondary {
            background: var(--surface-color);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        /* 模态框开启时禁止body滚动 */
        body.modal-open {
            overflow: hidden;
        }

        .debug-info {
            background: #f0f0f0;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>模态框显示测试</h1>
    
    <button class="test-button" onclick="showModal()">显示模态框</button>
    <button class="test-button" onclick="testEditRule()">测试编辑规则</button>
    
    <div class="debug-info" id="debug-info">
        调试信息将显示在这里...
    </div>

    <!-- 规则编辑模态框 -->
    <div id="edit-rule-modal" class="rule-edit-modal">
        <div class="modal-overlay" onclick="closeModal()"></div>
        <div class="modal-container">
            <div class="modal-header">
                <h2 class="modal-title">
                    <i class="fas fa-edit"></i>
                    编辑规则测试
                </h2>
                <button class="modal-close-btn" onclick="closeModal()">
                    <i class="fas fa-times">×</i>
                </button>
            </div>
            
            <div class="modal-body">
                <p>这是一个测试模态框。如果您能看到这个内容，说明模态框显示正常。</p>
                <p>模态框的CSS和JavaScript都在正常工作。</p>
            </div>
            
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">
                    取消
                </button>
                <button type="button" class="btn btn-primary" onclick="closeModal()">
                    确定
                </button>
            </div>
        </div>
    </div>

    <script>
        function log(message) {
            const debugInfo = document.getElementById('debug-info');
            const timestamp = new Date().toLocaleTimeString();
            debugInfo.innerHTML += `[${timestamp}] ${message}<br>`;
            console.log(message);
        }

        function showModal() {
            log('显示模态框函数被调用');
            const modal = document.getElementById('edit-rule-modal');
            log('模态框元素: ' + (modal ? '找到' : '未找到'));
            
            if (modal) {
                modal.classList.add('show');
                document.body.classList.add('modal-open');
                log('模态框已显示，添加了show类');
                log('模态框当前类名: ' + modal.className);
            } else {
                log('错误：找不到模态框元素');
            }
        }

        function closeModal() {
            log('关闭模态框函数被调用');
            const modal = document.getElementById('edit-rule-modal');
            if (modal) {
                modal.classList.remove('show');
                document.body.classList.remove('modal-open');
                log('模态框已关闭');
            }
        }

        function testEditRule() {
            log('测试编辑规则函数被调用');
            // 模拟真实的编辑规则流程
            showModal();
        }

        // 页面加载完成后的初始化
        document.addEventListener('DOMContentLoaded', function() {
            log('页面加载完成');
            log('模态框元素存在: ' + (document.getElementById('edit-rule-modal') ? '是' : '否'));
        });
    </script>
</body>
</html>
