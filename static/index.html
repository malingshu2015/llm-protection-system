<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型测试中心 - 本地大模型防护系统</title>
    
    <!-- 基础样式 -->
    <link rel="stylesheet" href="/static/admin/css/monitor-modern.css">
    
    <!-- 页面特定样式 (保留原有布局逻辑，但适配变量) -->
    <style>
        /* 测试中心布局适配 */
        .testing-center {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 24px;
            height: calc(100vh - 180px); /* Adjust for header/footer */
            min-height: 600px;
        }

        /* 复用面板样式 */
        .control-panel, .chat-area {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header, .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title, .chat-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .panel-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        /* 控件样式适配 */
        .model-select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-primary);
            color: var(--text-primary);
            margin-bottom: 1rem;
        }

        .parameter-group {
            margin-bottom: 1.5rem;
        }
        
        .parameter-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-primary);
        }

        .parameter-slider {
            width: 100%;
            accent-color: var(--primary-color);
        }

        /* 聊天气泡适配 */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
        }

        .message.user .message-content {
            background: var(--primary-color);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }
        
        /* 输入框 */
        .input-area {
            padding: 16px;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
        }
        
        .message-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-primary);
            color: var(--text-primary);
            resize: none;
            min-height: 50px;
        }
        
        .send-button {
            margin-top: 8px;
            float: right;
            padding: 8px 24px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
        }
        
        .send-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Status Indicators */
        .status-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
        }
    </style>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/static/admin/js/apple-ui.js" defer></script>
</head>

<body>
    <div class="container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <i class="fas fa-shield-alt" style="font-size: 24px; color: #007AFF;"></i>
                    <h2 style="font-size: 16px; font-weight: 600;">LLM Shield</h2>
                </div>
            </div>

            <ul class="sidebar-menu">
                <li class="sidebar-menu-item">
                    <a href="/static/admin/monitor.html" class="sidebar-menu-link">
                        <span class="sidebar-menu-icon"><i class="fas fa-chart-pie"></i></span>
                        <span class="sidebar-menu-text">监控概览</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="/static/admin/realtime_monitor.html" class="sidebar-menu-link">
                        <span class="sidebar-menu-icon"><i class="fas fa-heartbeat"></i></span>
                        <span class="sidebar-menu-text">实时流量</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="/static/admin/events.html" class="sidebar-menu-link">
                        <span class="sidebar-menu-icon"><i class="fas fa-shield-virus"></i></span>
                        <span class="sidebar-menu-text">安全事件</span>
                    </a>
                </li>
                <div style="height: 1px; background: var(--border-color); margin: 8px 16px;"></div>
                <li class="sidebar-menu-item">
                    <a href="/static/admin/rules.html" class="sidebar-menu-link">
                        <span class="sidebar-menu-icon"><i class="fas fa-list-check"></i></span>
                        <span class="sidebar-menu-text">规则管理</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="/static/admin/model_rules.html" class="sidebar-menu-link">
                        <span class="sidebar-menu-icon"><i class="fas fa-cogs"></i></span>
                        <span class="sidebar-menu-text">规则配置</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="/static/admin/models.html" class="sidebar-menu-link">
                        <span class="sidebar-menu-icon"><i class="fas fa-layer-group"></i></span>
                        <span class="sidebar-menu-text">模型管理</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="/static/admin/auth_management.html" class="sidebar-menu-link">
                        <span class="sidebar-menu-icon"><i class="fas fa-key"></i></span>
                        <span class="sidebar-menu-text">授权管理</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="/static/index.html" class="sidebar-menu-link active">
                        <span class="sidebar-menu-icon"><i class="fas fa-comments"></i></span>
                        <span class="sidebar-menu-text">聊天测试</span>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部状态栏 -->
            <div class="monitor-status-bar">
                <div style="display: flex; flex-direction: column;">
                    <h1 style="font-size: 1.5rem; font-weight: 700; margin: 0 0 4px 0;">模型测试中心</h1>
                    <div style="font-size: 0.875rem; color: var(--text-secondary);">
                        实时测试 LLM 响应与安全拦截效果
                    </div>
                </div>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <button class="btn-icon" id="theme-toggle" title="切换主题">
                        <i class="fas fa-moon"></i>
                    </button>
                    <button class="btn-icon" id="clear-chat" title="清空对话">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>

            <!-- 测试中心主体 -->
            <div class="testing-center">
                <!-- 左侧配置 -->
                <div class="control-panel">
                    <div class="panel-header">
                        <div class="panel-title"><i class="fas fa-sliders-h"></i> 配置</div>
                    </div>
                    <div class="panel-body">
                        <div class="form-group">
                            <label class="form-label">选择模型</label>
                            <select id="model-select" class="model-select">
                                <option value="">加载中...</option>
                            </select>
                        </div>

                        <div class="parameter-group">
                            <div class="parameter-label"><span>温度</span><span id="temperature-value">0.7</span></div>
                            <input type="range" id="temperature-slider" class="parameter-slider" min="0" max="2" step="0.1" value="0.7">
                        </div>

                        <div class="parameter-group">
                            <div class="parameter-label"><span>最大 Token</span><span id="max-tokens-value">2048</span></div>
                            <input type="range" id="max-tokens-slider" class="parameter-slider" min="1" max="4096" step="1" value="2048">
                        </div>

                        <div style="margin-top: auto;">
                            <div class="status-item">
                                <span>API 状态</span>
                                <span style="color: var(--success-color);">● 在线</span>
                            </div>
                            <div class="status-item">
                                <span>响应时间</span>
                                <span id="response-time">- ms</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 右侧对话 -->
                <div class="chat-area">
                    <div class="chat-header">
                        <div class="chat-title"><i class="fas fa-comments"></i> 对话</div>
                    </div>
                    
                    <div class="messages-container" id="messages-container">
                        <!-- 欢迎语 -->
                        <div class="message assistant">
                            <div class="message-content">
                                <strong>欢迎来到测试中心！</strong><br>
                                请在左侧选择一个模型，然后输入内容开始测试安全规则拦截效果。
                            </div>
                        </div>
                    </div>

                    <div class="input-area">
                        <textarea id="message-input" class="message-input" placeholder="输入消息... (Enter 发送)" rows="2"></textarea>
                        <button id="send-button" class="send-button" disabled>发送</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 简化的逻辑脚本，复用原有核心逻辑
        let currentModel = null;
        let isGenerating = false;

        document.addEventListener('DOMContentLoaded', async () => {
            // Theme Init
            const themeBtn = document.getElementById('theme-toggle');
            themeBtn.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
            });

            // Load Models
            await loadModels();
            
            // Events
            const input = document.getElementById('message-input');
            const sendBtn = document.getElementById('send-button');
            
            input.addEventListener('input', () => {
                sendBtn.disabled = !input.value.trim() || !currentModel;
            });
            
            input.addEventListener('keydown', (e) => {
                if(e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            sendBtn.addEventListener('click', sendMessage);
            document.getElementById('clear-chat').addEventListener('click', () => {
                document.getElementById('messages-container').innerHTML = '';
            });
            
            document.getElementById('model-select').addEventListener('change', (e) => {
                currentModel = e.target.value;
                input.dispatchEvent(new Event('input'));
            });
        });

        async function loadModels() {
            try {
                const res = await fetch('/api/v1/ollama/models');
                const data = await res.json();
                const select = document.getElementById('model-select');
                
                if(data.data && data.data.length > 0) {
                    select.innerHTML = '<option value="">请选择模型</option>' + 
                        data.data.map(m => `<option value="${m.id}">${m.id}</option>`).join('');
                } else {
                    select.innerHTML = '<option value="">无可用模型</option>';
                }
            } catch(e) {
                console.error(e);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const container = document.getElementById('messages-container');
            const msg = input.value.trim();
            if(!msg || !currentModel) return;

            // User Msg
            addMessage('user', msg);
            input.value = '';
            
            // Assistant Msg (Loading)
            const loadingId = addMessage('assistant', '<i class="fas fa-circle-notch fa-spin"></i> 思考中...');
            
            try {
                const start = Date.now();
                const res = await fetch('/v1/chat/completions', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer test'},
                    body: JSON.stringify({
                        model: currentModel,
                        messages: [{role: 'user', content: msg}]
                    })
                });
                
                document.getElementById('response-time').textContent = (Date.now() - start) + ' ms';
                
                const data = await res.json();
                
                // Remove loading, add response
                document.getElementById(loadingId).remove();
                
                if(res.status === 403) {
                    // Security Block
                    addMessage('assistant', `🚫 **已拦截**: ${data.error || '安全规则触发'}`, true);
                } else {
                    addMessage('assistant', data.choices[0].message.content);
                }
                
            } catch(e) {
                document.getElementById(loadingId).remove();
                addMessage('assistant', '请求失败: ' + e.message);
            }
        }

        function addMessage(role, html, isSecurity = false) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.id = 'msg-' + Date.now();
            
            div.innerHTML = `<div class="message-content" style="${isSecurity ? 'background:#fee; color:#c00; border:1px solid #fcc;' : ''}">${html}</div>`;
            
            const container = document.getElementById('messages-container');
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div.id;
        }
    </script>
</body>
</html>
