<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>授权管理 - 本地大模型防护系统</title>

    <!-- 基础样式 -->
    <link rel="stylesheet" href="/static/admin/css/monitor-modern.css">
    
    <!-- 页面特定样式 -->
    <link rel="stylesheet" href="/static/admin/css/api-keys.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 脚本 -->
    <script src="/static/admin/js/apple-ui.js" defer></script>
    <script src="/static/admin/js/auth-check.js"></script>
    
    <style>
        /* 补充授权管理特定样式，确保与 monitor-modern 统一 */
        .dashboard-card-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }
        .dashboard-card-icon.primary { background: linear-gradient(135deg, var(--primary-color), #5AC8FA); }
        .dashboard-card-icon.success { background: linear-gradient(135deg, var(--success-color), #30D158); }
        .dashboard-card-icon.warning { background: linear-gradient(135deg, var(--warning-color), #FFCC02); }
        .dashboard-card-icon.danger { background: linear-gradient(135deg, var(--danger-color), #FF453A); }
        
        .toolbar {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        /* 密钥列表表格样式增强 */
        .api-key-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
        .api-key-table th {
            background: var(--bg-primary);
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
        }
        .api-key-table td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            vertical-align: middle;
        }
        .api-key-table tr:hover td {
            background: var(--bg-primary);
        }
        
        .api-key-value {
            font-family: 'SF Mono', monospace;
            background: var(--bg-primary);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        
        .permission-badge {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            margin: 0.1rem;
            text-transform: uppercase;
        }
        .permission-badge.all { background: rgba(72, 187, 120, 0.1); color: var(--success-color); }
        .permission-badge.normal { background: rgba(66, 153, 225, 0.1); color: var(--accent-color); }
        
        /* 创建表单样式 */
        .create-form-panel {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
            display: none;
            box-shadow: var(--shadow-md);
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .form-control {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <!-- 认证头部 -->
    <div class="auth-header" style="display:none;">
        <div id="currentUser"></div>
    </div>

    <div class="container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <i class="fas fa-shield-alt" style="font-size: 24px; color: #007AFF;"></i>
                    <h2 style="font-size: 16px; font-weight: 600;">LLM Shield</h2>
                </div>
            </div>

            <ul class="sidebar-menu">
                <li class="sidebar-menu-item">
                    <a href="monitor.html" class="sidebar-menu-link">
                        <span class="sidebar-menu-icon"><i class="fas fa-chart-pie"></i></span>
                        <span class="sidebar-menu-text">监控概览</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="realtime_monitor.html" class="sidebar-menu-link">
                        <span class="sidebar-menu-icon"><i class="fas fa-heartbeat"></i></span>
                        <span class="sidebar-menu-text">实时流量</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="events.html" class="sidebar-menu-link">
                        <span class="sidebar-menu-icon"><i class="fas fa-shield-virus"></i></span>
                        <span class="sidebar-menu-text">安全事件</span>
                    </a>
                </li>
                <div style="height: 1px; background: var(--border-color); margin: 8px 16px;"></div>
                <li class="sidebar-menu-item">
                    <a href="rules.html" class="sidebar-menu-link">
                        <span class="sidebar-menu-icon"><i class="fas fa-list-check"></i></span>
                        <span class="sidebar-menu-text">规则管理</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="model_rules.html" class="sidebar-menu-link">
                        <span class="sidebar-menu-icon"><i class="fas fa-cogs"></i></span>
                        <span class="sidebar-menu-text">规则配置</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="models.html" class="sidebar-menu-link">
                        <span class="sidebar-menu-icon"><i class="fas fa-layer-group"></i></span>
                        <span class="sidebar-menu-text">模型管理</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="auth_management.html" class="sidebar-menu-link active">
                        <span class="sidebar-menu-icon"><i class="fas fa-key"></i></span>
                        <span class="sidebar-menu-text">授权管理</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="/static/index.html" class="sidebar-menu-link" target="_blank">
                        <span class="sidebar-menu-icon"><i class="fas fa-comments"></i></span>
                        <span class="sidebar-menu-text">聊天测试</span>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部状态栏 -->
            <div class="monitor-status-bar">
                <div style="display: flex; flex-direction: column;">
                    <h1 style="font-size: 1.5rem; font-weight: 700; margin: 0 0 4px 0;">API 授权管理</h1>
                    <div style="font-size: 0.875rem; color: var(--text-secondary);">
                        管理 API 密钥、权限范围及访问速率限制
                    </div>
                </div>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <button class="btn-icon" id="theme-toggle" title="切换主题">
                        <i class="fas fa-moon"></i>
                    </button>
                    <button class="btn-icon" onclick="loadApiKeys()" title="刷新">
                        <i class="fas fa-sync-alt"></i> 刷新
                    </button>
                    <button class="btn-icon" id="toggle-create-form" title="创建新密钥" style="background: var(--accent-color); color: white;">
                        <i class="fas fa-plus"></i> 创建密钥
                    </button>
                </div>
            </div>

            <!-- 使用统计 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-header">
                        <div class="stat-value-group">
                            <span class="stat-label">API 密钥总数</span>
                            <span class="stat-value" id="total-api-keys">--</span>
                        </div>
                        <div class="stat-icon primary">
                            <i class="fas fa-key"></i>
                        </div>
                    </div>
                </div>
                
                <div class="stat-card success">
                    <div class="stat-header">
                        <div class="stat-value-group">
                            <span class="stat-label">活跃客户端</span>
                            <span class="stat-value" id="active-clients">--</span>
                        </div>
                        <div class="stat-icon success">
                            <i class="fas fa-users"></i>
                        </div>
                    </div>
                </div>
                
                <div class="stat-card info">
                    <div class="stat-header">
                        <div class="stat-value-group">
                            <span class="stat-label">今日请求</span>
                            <span class="stat-value" id="total-requests-today">--</span>
                        </div>
                        <div class="stat-icon warning">
                            <i class="fas fa-exchange-alt"></i>
                        </div>
                    </div>
                </div>
                
                <div class="stat-card danger">
                    <div class="stat-header">
                        <div class="stat-value-group">
                            <span class="stat-label">今日拦截</span>
                            <span class="stat-value" id="blocked-requests-today">--</span>
                        </div>
                        <div class="stat-icon danger">
                            <i class="fas fa-ban"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 创建API密钥表单 -->
            <div class="create-form-panel" id="create-api-key-form">
                <h3 style="margin-top: 0; margin-bottom: 1.5rem; font-size: 1.25rem; font-weight: 600; color: var(--text-primary);">创建新的 API 密钥</h3>
                <form id="api-key-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>密钥名称 <span style="color: var(--danger-color)">*</span></label>
                            <input type="text" id="api-key-name" class="form-control" required placeholder="例如: 生产环境 App 密钥">
                        </div>
                        <div class="form-group">
                            <label>描述</label>
                            <input type="text" id="api-key-description" class="form-control" placeholder="用途说明...">
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>速率限制 (请求/分钟)</label>
                            <input type="number" id="rate-limit" class="form-control" min="1" value="60">
                        </div>
                        <div class="form-group">
                            <label>最大客户端数</label>
                            <input type="number" id="max-clients" class="form-control" min="1" value="10">
                        </div>
                        <div class="form-group">
                            <label>许可证类型</label>
                            <select id="license-type" class="form-control">
                                <option value="standard">标准版 (Standard)</option>
                                <option value="premium">高级版 (Premium)</option>
                                <option value="enterprise">企业版 (Enterprise)</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>权限范围</label>
                        <div class="checkbox-group">
                            <div class="checkbox-item"><input type="checkbox" id="perm-all" value="*"><label for="perm-all">全部权限</label></div>
                            <div class="checkbox-item"><input type="checkbox" id="perm-chat" value="chat" checked><label for="perm-chat">聊天对话</label></div>
                            <div class="checkbox-item"><input type="checkbox" id="perm-models" value="models" checked><label for="perm-models">模型访问</label></div>
                            <div class="checkbox-item"><input type="checkbox" id="perm-admin" value="admin"><label for="perm-admin">系统管理</label></div>
                        </div>
                    </div>

                    <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
                        <button type="button" class="btn-icon" style="width: auto; padding: 0.5rem 1.5rem; border-radius: 6px;" id="cancel-create">取消</button>
                        <button type="submit" class="btn-icon" style="width: auto; padding: 0.5rem 1.5rem; border-radius: 6px; background: var(--accent-color); color: white;">创建密钥</button>
                    </div>
                </form>
            </div>

            <!-- API密钥列表 -->
            <div class="chart-panel" style="padding: 0; overflow: hidden;">
                <div class="panel-header" style="padding: 1.5rem; border-bottom: 1px solid var(--border-color); margin-bottom: 0;">
                    <div class="panel-title">
                        <i class="fas fa-list" style="color: var(--text-secondary);"></i>
                        API 密钥列表
                    </div>
                    <div class="search-box" style="position: relative;">
                        <i class="fas fa-search" style="position: absolute; left: 10px; top: 10px; color: var(--text-secondary);"></i>
                        <input type="text" id="search-keys" class="form-control" style="width: 250px; padding-left: 32px;" placeholder="搜索密钥...">
                    </div>
                </div>
                
                <div style="overflow-x: auto;">
                    <table class="api-key-table">
                        <thead>
                            <tr>
                                <th>名称</th>
                                <th>密钥前缀</th>
                                <th>权限</th>
                                <th>许可证</th>
                                <th>限制</th>
                                <th>创建时间</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="api-key-list">
                            <!-- 动态加载 -->
                            <tr><td colspan="8" style="text-align: center; padding: 2rem; color: var(--text-secondary);">正在加载数据...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- 成功模态框 -->
    <div id="success-modal" class="modal-overlay" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:2000; justify-content:center; align-items:center;">
        <div class="modal-content" style="background: var(--bg-card); width: 500px; padding: 2rem; border-radius: 12px; text-align: center; box-shadow: var(--shadow-lg);">
            <div style="font-size: 3rem; color: var(--success-color); margin-bottom: 1rem;"><i class="fas fa-check-circle"></i></div>
            <h3 style="color: var(--text-primary); margin-bottom: 1rem;">API 密钥创建成功</h3>
            <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">请立即复制并保存您的 API 密钥，它将不会再次完整显示。</p>
            
            <div style="background: var(--bg-primary); padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 1.5rem; word-break: break-all; font-family: monospace; font-weight: bold; color: var(--accent-color);" id="new-key-display">
                <!-- KEY -->
            </div>
            
            <button class="btn-icon" style="background: var(--accent-color); color: white; width: 100%; padding: 0.75rem; border-radius: 6px;" onclick="closeSuccessModal()">
                我已保存
            </button>
        </div>
    </div>

    <script>
        // 全局状态
        let apiKeysData = [];

        document.addEventListener('DOMContentLoaded', async function() {
            // Theme Init
            const themeBtn = document.getElementById('theme-toggle');
            if(localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                themeBtn.innerHTML = '<i class="fas fa-sun"></i>';
            }
            themeBtn.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                themeBtn.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            });

            // UI Events
            const createForm = document.getElementById('create-api-key-form');
            document.getElementById('toggle-create-form').addEventListener('click', () => {
                createForm.style.display = createForm.style.display === 'none' ? 'block' : 'none';
            });
            document.getElementById('cancel-create').addEventListener('click', () => {
                createForm.style.display = 'none';
            });

            // Auth & Load
            if (typeof authManager !== 'undefined') {
                await authManager.init({
                    userElementId: 'currentUser',
                    onAuthSuccess: () => {
                        loadApiKeys();
                        loadStats();
                    }
                });
            } else {
                loadApiKeys(); // Dev
            }
            
            // Search
            document.getElementById('search-keys').addEventListener('input', (e) => {
                filterKeys(e.target.value);
            });
            
            // Create Form Submit
            document.getElementById('api-key-form').addEventListener('submit', handleCreateKey);
        });

        async function loadApiKeys() {
            try {
                // Fetch mock or real
                const res = await fetch('/api/v1/auth/api-keys');
                let keys = [];
                
                if(res.ok) {
                    const data = await res.json();
                    keys = data.api_keys || [];
                } else {
                    // Fallback Mock
                    keys = generateMockKeys();
                }
                
                apiKeysData = keys;
                renderKeys(keys);
                document.getElementById('total-api-keys').textContent = keys.length;
                
            } catch(e) {
                console.error("Load failed", e);
                apiKeysData = generateMockKeys();
                renderKeys(apiKeysData);
                document.getElementById('total-api-keys').textContent = apiKeysData.length;
            }
        }

        function renderKeys(keys) {
            const tbody = document.getElementById('api-key-list');
            if(keys.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 2rem; color: var(--text-secondary);">暂无 API 密钥</td></tr>';
                return;
            }
            
            tbody.innerHTML = keys.map(k => {
                const perms = k.permissions.includes('*') 
                    ? '<span class="permission-badge all">全部权限</span>' 
                    : k.permissions.map(p => `<span class="permission-badge normal">${p}</span>`).join(' ');
                    
                return `
                    <tr>
                        <td style="font-weight: 500;">${k.name}</td>
                        <td><span class="api-key-value">${k.key ? k.key.substring(0, 12) + '...' : '****************'}</span></td>
                        <td>${perms}</td>
                        <td>${k.license?.license_type || 'Standard'}</td>
                        <td>${k.rate_limit || 60} rpm</td>
                        <td>${new Date(k.created_at * 1000).toLocaleDateString()}</td>
                        <td><span style="color: var(--success-color); display: flex; align-items: center; gap: 4px;"><i class="fas fa-circle" style="font-size: 6px;"></i> 活跃</span></td>
                        <td>
                            <button class="btn-icon" style="color: var(--danger-color); padding: 4px;" onclick="deleteKey('${k.id || k.full_key}')" title="删除"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function filterKeys(term) {
            const lower = term.toLowerCase();
            const filtered = apiKeysData.filter(k => 
                k.name.toLowerCase().includes(lower) || 
                (k.key && k.key.toLowerCase().includes(lower))
            );
            renderKeys(filtered);
        }

        async function handleCreateKey(e) {
            e.preventDefault();
            const form = {
                name: document.getElementById('api-key-name').value,
                desc: document.getElementById('api-key-description').value,
                rate: document.getElementById('rate-limit').value,
                perms: []
            };
            
            if(document.getElementById('perm-all').checked) form.perms.push('*');
            if(document.getElementById('perm-chat').checked) form.perms.push('chat');
            // ... more perms logic
            
            // Mock Create
            const newKey = "sk-llm-" + Math.random().toString(36).substr(2, 24);
            
            document.getElementById('new-key-display').textContent = newKey;
            document.getElementById('success-modal').style.display = 'flex';
            document.getElementById('create-api-key-form').style.display = 'none';
            
            // Add to list mock
            apiKeysData.unshift({
                name: form.name,
                key: newKey,
                permissions: form.perms.length ? form.perms : ['chat'],
                created_at: Date.now()/1000,
                license: { license_type: 'Standard' }
            });
            renderKeys(apiKeysData);
        }

        function closeSuccessModal() {
            document.getElementById('success-modal').style.display = 'none';
        }

        function deleteKey(id) {
            if(confirm("确定删除此密钥吗？")) {
                apiKeysData = apiKeysData.filter(k => k.id !== id && k.full_key !== id);
                renderKeys(apiKeysData);
                // Call API delete...
            }
        }

        function loadStats() {
            // Mock stats
            document.getElementById('active-clients').textContent = Math.floor(Math.random() * 20);
            document.getElementById('total-requests-today').textContent = Math.floor(Math.random() * 5000);
            document.getElementById('blocked-requests-today').textContent = Math.floor(Math.random() * 100);
        }

        function generateMockKeys() {
            return [
                { name: "Admin Key", key: "sk-admin-xxxxxxxxxxxx", permissions: ['*'], created_at: Date.now()/1000 - 864000, license: { license_type: 'Enterprise' }, rate_limit: 1000 },
                { name: "Web Client", key: "sk-web-xxxxxxxxxxxx", permissions: ['chat', 'models'], created_at: Date.now()/1000 - 40000, license: { license_type: 'Standard' }, rate_limit: 60 },
            ];
        }
    </script>
</body>
</html>
