<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全事件 - 本地大模型防护系统</title>

    <!-- 基础样式 -->
    <link rel="stylesheet" href="/static/admin/css/monitor-modern.css">
    <!-- 事件页面特定样式 -->
    <link rel="stylesheet" href="/static/admin/css/apple-events.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/admin/js/auth-check.js"></script>
    <style>
        /* 复用 monitor-modern.css 的变量，补充特定样式 */
        .event-details-panel {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            margin-top: 1rem;
            border: 1px solid var(--border-color);
            display: none; /* 默认隐藏，点击展开 */
        }
        
        .severity-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .severity-critical { background: rgba(245, 101, 101, 0.1); color: var(--danger-color); }
        .severity-high { background: rgba(237, 137, 54, 0.1); color: var(--warning-color); }
        .severity-medium { background: rgba(66, 153, 225, 0.1); color: var(--accent-color); }
        .severity-low { background: rgba(72, 187, 120, 0.1); color: var(--success-color); }
        
        .filters-toolbar {
            background: var(--bg-card);
            padding: 1rem;
            border-radius: var(--radius-md);
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
            border: 1px solid var(--border-color);
        }
        
        .data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
        
        .data-table th {
            text-align: left;
            padding: 1rem;
            color: var(--text-secondary);
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-primary);
        }
        
        .data-table td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        
        .data-table tr:hover td {
            background: var(--bg-primary);
            cursor: pointer;
        }

        .data-table tr:last-child td {
            border-bottom: none;
        }
        
        /* 详情模态框覆盖样式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(2px);
        }
        
        .modal-content {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-md);
            position: relative;
        }

        .detail-row {
            display: flex;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
        }
        .detail-label {
            width: 120px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .detail-value {
            flex: 1;
            color: var(--text-primary);
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>

<body>
    <!-- 认证头部 -->
    <div class="auth-header" style="display:none;">
        <div id="currentUser"></div>
    </div>

    <div class="container">
        <!-- 侧边栏 (复用标准模板) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <i class="fas fa-shield-alt" style="font-size: 24px; color: #007AFF;"></i>
                    <h2 style="font-size: 16px; font-weight: 600;">LLM Shield</h2>
                </div>
            </div>

            <ul class="sidebar-menu">
                <li class="sidebar-menu-item">
                    <a href="monitor.html" class="sidebar-menu-link">
                        <span class="sidebar-menu-icon"><i class="fas fa-chart-pie"></i></span>
                        <span class="sidebar-menu-text">监控概览</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="realtime_monitor.html" class="sidebar-menu-link">
                        <span class="sidebar-menu-icon"><i class="fas fa-heartbeat"></i></span>
                        <span class="sidebar-menu-text">实时流量</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="events.html" class="sidebar-menu-link active">
                        <span class="sidebar-menu-icon"><i class="fas fa-shield-virus"></i></span>
                        <span class="sidebar-menu-text">安全事件</span>
                    </a>
                </li>
                <div style="height: 1px; background: var(--border-color); margin: 8px 16px;"></div>
                <li class="sidebar-menu-item">
                    <a href="rules.html" class="sidebar-menu-link">
                        <span class="sidebar-menu-icon"><i class="fas fa-list-check"></i></span>
                        <span class="sidebar-menu-text">规则管理</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="model_rules.html" class="sidebar-menu-link">
                        <span class="sidebar-menu-icon"><i class="fas fa-cogs"></i></span>
                        <span class="sidebar-menu-text">规则配置</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="models.html" class="sidebar-menu-link">
                        <span class="sidebar-menu-icon"><i class="fas fa-layer-group"></i></span>
                        <span class="sidebar-menu-text">模型管理</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="auth_management.html" class="sidebar-menu-link">
                        <span class="sidebar-menu-icon"><i class="fas fa-key"></i></span>
                        <span class="sidebar-menu-text">授权管理</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="/static/index.html" class="sidebar-menu-link" target="_blank">
                        <span class="sidebar-menu-icon"><i class="fas fa-comments"></i></span>
                        <span class="sidebar-menu-text">聊天测试</span>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部状态栏 -->
            <div class="monitor-status-bar">
                <div style="display: flex; flex-direction: column;">
                    <h1 style="font-size: 1.5rem; font-weight: 700; margin: 0 0 4px 0;">安全事件日志</h1>
                    <div style="font-size: 0.875rem; color: var(--text-secondary);">
                        查询历史拦截记录与威胁分析
                    </div>
                </div>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <button class="btn-icon" id="theme-toggle" title="切换主题">
                        <i class="fas fa-moon"></i>
                    </button>
                    <button class="btn-icon" onclick="loadEvents()" title="刷新">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                    <button class="btn-icon" onclick="exportEvents()" title="导出CSV">
                        <i class="fas fa-download"></i>
                    </button>
                </div>
            </div>

            <!-- 过滤器工具栏 -->
            <div class="filters-toolbar">
                <div style="flex: 1; min-width: 200px;">
                    <div style="position: relative;">
                        <i class="fas fa-search" style="position: absolute; left: 10px; top: 10px; color: var(--text-secondary);"></i>
                        <input type="text" id="search-input" class="select-modern" style="width: 100%; padding-left: 32px; cursor: text;" placeholder="搜索规则 ID、内容...">
                    </div>
                </div>
                <select id="severity-filter" class="select-modern">
                    <option value="">所有等级</option>
                    <option value="critical">Critical</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
                <select id="type-filter" class="select-modern">
                    <option value="">所有类型</option>
                    <option value="prompt_injection">Prompt Injection</option>
                    <option value="sensitive_info">Sensitive Info</option>
                    <option value="harmful_content">Harmful Content</option>
                </select>
                <select id="time-filter" class="select-modern">
                    <option value="24h">最近 24 小时</option>
                    <option value="7d">最近 7 天</option>
                    <option value="30d">最近 30 天</option>
                </select>
            </div>

            <!-- 事件表格 -->
            <div class="chart-panel" style="padding: 0; overflow: hidden;">
                <div style="overflow-x: auto;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>时间</th>
                                <th>威胁等级</th>
                                <th>类型</th>
                                <th>触发规则</th>
                                <th>摘要</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="events-table-body">
                            <!-- 动态加载 -->
                             <tr><td colspan="7" style="text-align: center; padding: 2rem;">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
                <!-- 分页 -->
                <div style="padding: 1rem; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 0.875rem; color: var(--text-secondary);" id="pagination-info">显示 0 - 0 条，共 0 条</span>
                    <div style="display: flex; gap: 0.5rem;">
                        <button class="btn-icon" onclick="prevPage()"><i class="fas fa-chevron-left"></i></button>
                        <button class="btn-icon" onclick="nextPage()"><i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- 详情模态框 -->
    <div id="detail-modal" class="modal-overlay">
        <div class="modal-content">
            <div style="padding: 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0; font-size: 1.25rem; font-weight: 600; color: var(--text-primary);">事件详情</h3>
                <button class="btn-icon" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <div style="padding: 1.5rem;" id="modal-body">
                <!-- 动态内容 -->
            </div>
            <div style="padding: 1.5rem; border-top: 1px solid var(--border-color); text-align: right; background: var(--bg-primary);">
                <button class="btn-icon" style="width: auto; padding: 0.5rem 1rem; border-radius: 6px; background: var(--accent-color); color: white;" onclick="closeModal()">关闭</button>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let allEvents = [];
        let filteredEvents = [];
        let currentPage = 1;
        const pageSize = 15;

        document.addEventListener('DOMContentLoaded', async function() {
            // Theme Init
            const themeBtn = document.getElementById('theme-toggle');
            if(localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                themeBtn.innerHTML = '<i class="fas fa-sun"></i>';
            }
            themeBtn.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                themeBtn.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            });

            // Filters
            ['search-input', 'severity-filter', 'type-filter', 'time-filter'].forEach(id => {
                document.getElementById(id).addEventListener('input', applyFilters);
            });

            // Auth & Load
            if (typeof authManager !== 'undefined') {
                await authManager.init({
                    userElementId: 'currentUser',
                    onAuthSuccess: () => {
                        loadEvents();
                    }
                });
            } else {
                loadEvents(); // Dev
            }
        });

        async function loadEvents() {
            const tbody = document.getElementById('events-table-body');
            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 2rem;">加载中...</td></tr>';
            
            try {
                // Fetch from API
                const limit = 1000; // 获取最近1000条用于前端分页筛选
                const res = await fetch(`/api/v1/events?limit=${limit}`);
                let data = { events: [] };
                if(res.ok) {
                    data = await res.json();
                } else {
                    // Mock data fallback
                    data.events = generateMockEvents();
                }
                
                allEvents = data.events || [];
                applyFilters();
                
            } catch(e) {
                console.error("Load failed", e);
                allEvents = generateMockEvents();
                applyFilters();
            }
        }

        function applyFilters() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const severity = document.getElementById('severity-filter').value;
            const type = document.getElementById('type-filter').value;
            // time filter logic simplified here
            
            filteredEvents = allEvents.filter(ev => {
                if(search && !JSON.stringify(ev).toLowerCase().includes(search)) return false;
                if(severity && ev.severity !== severity) return false;
                if(type && ev.detection_type !== type) return false;
                return true;
            });
            
            currentPage = 1;
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('events-table-body');
            tbody.innerHTML = '';
            
            const start = (currentPage - 1) * pageSize;
            const pageData = filteredEvents.slice(start, start + pageSize);
            
            if(pageData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 2rem; color: var(--text-secondary);">暂无数据</td></tr>';
                return;
            }
            
            pageData.forEach(ev => {
                const tr = document.createElement('tr');
                tr.onclick = () => showDetails(ev);
                
                tr.innerHTML = `
                    <td>${new Date(ev.timestamp * 1000).toLocaleString()}</td>
                    <td><span class="severity-badge severity-${ev.severity || 'low'}">${ev.severity || 'LOW'}</span></td>
                    <td>${ev.detection_type || 'Unknown'}</td>
                    <td><code style="background: var(--bg-primary); padding: 2px 6px; border-radius: 4px;">${ev.rule_id || '-'}</code></td>
                    <td style="max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${ev.sanitized_content || ev.matched_text || '-'}</td>
                    <td>
                        <span style="color: ${ev.is_blocked ? 'var(--danger-color)' : 'var(--success-color)'};">
                            <i class="fas fa-${ev.is_blocked ? 'ban' : 'check'}"></i> ${ev.is_blocked ? '拦截' : '放行'}
                        </span>
                    </td>
                    <td>
                        <button class="btn-icon" onclick="event.stopPropagation(); showDetails('${ev.event_id}')" title="详情"><i class="fas fa-eye"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            
            // Pagination Info
            document.getElementById('pagination-info').textContent = `显示 ${start + 1} - ${Math.min(start + pageSize, filteredEvents.length)} 条，共 ${filteredEvents.length} 条`;
        }

        function prevPage() {
            if(currentPage > 1) {
                currentPage--;
                renderTable();
            }
        }
        
        function nextPage() {
            if(currentPage * pageSize < filteredEvents.length) {
                currentPage++;
                renderTable();
            }
        }

        function showDetails(evOrId) {
            let ev = evOrId;
            if(typeof evOrId === 'string') {
                ev = allEvents.find(e => e.event_id === evOrId);
            }
            if(!ev) return;
            
            const body = document.getElementById('modal-body');
            body.innerHTML = `
                <div class="detail-row"><span class="detail-label">事件 ID</span><span class="detail-value">${ev.event_id}</span></div>
                <div class="detail-row"><span class="detail-label">时间</span><span class="detail-value">${new Date(ev.timestamp * 1000).toLocaleString()}</span></div>
                <div class="detail-row"><span class="detail-label">客户端</span><span class="detail-value">${ev.client_type}</span></div>
                <div class="detail-row"><span class="detail-label">检测类型</span><span class="detail-value">${ev.detection_type}</span></div>
                <div class="detail-row"><span class="detail-label">威胁等级</span><span class="detail-value"><span class="severity-badge severity-${ev.severity}">${ev.severity}</span></span></div>
                <div class="detail-row"><span class="detail-label">触发规则</span><span class="detail-value">${ev.rule_name} (${ev.rule_id})</span></div>
                <div class="detail-row"><span class="detail-label">拦截原因</span><span class="detail-value">${ev.reason}</span></div>
                <div class="detail-row"><span class="detail-label">匹配文本</span><span class="detail-value" style="background: rgba(245, 101, 101, 0.1); color: var(--danger-color); padding: 0.5rem; border-radius: 4px;">${ev.matched_text}</span></div>
                <div class="detail-row"><span class="detail-label">完整内容</span><span class="detail-value" style="background: var(--bg-primary); padding: 0.5rem; border-radius: 4px;">${ev.sanitized_content}</span></div>
            `;
            
            document.getElementById('detail-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detail-modal').style.display = 'none';
        }

        function exportEvents() {
            alert('导出功能即将上线');
        }

        function generateMockEvents() {
            // ... simple mock generator similar to before if needed ...
            return [];
        }
    </script>
</body>
</html>
