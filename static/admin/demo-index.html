<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型市场演示入口</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #007AFF;
            --success-color: #34C759;
            --warning-color: #FF9500;
            --danger-color: #FF3B30;
            --surface-color: #FFFFFF;
            --surface-secondary: #F2F2F7;
            --text-primary: #000000;
            --text-secondary: #8E8E93;
            --border-color: #C6C6C8;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.15);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            text-align: center;
            padding: 40px;
        }

        .logo {
            font-size: 4em;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.3em;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .demo-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .demo-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: var(--radius-lg);
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .demo-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .demo-card:hover::before {
            left: 100%;
        }

        .demo-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
            background: rgba(255, 255, 255, 0.15);
        }

        .demo-card i {
            font-size: 3em;
            margin-bottom: 15px;
            color: var(--warning-color);
        }

        .demo-card h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .demo-card p {
            opacity: 0.8;
            margin-bottom: 20px;
        }

        .btn {
            background: var(--primary-color);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: #0056cc;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        .btn i {
            margin-right: 8px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .feature {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: var(--radius-md);
            text-align: center;
        }

        .feature i {
            font-size: 2em;
            margin-bottom: 10px;
            color: var(--success-color);
        }

        .feature h4 {
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2.5em;
            }
            
            .subtitle {
                font-size: 1.1em;
            }
            
            .demo-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <i class="fas fa-robot"></i>
        </div>
        
        <h1>模型市场交互演示</h1>
        <p class="subtitle">体验现代化的模型管理界面和交互功能</p>

        <div class="demo-cards">
            <div class="demo-card">
                <i class="fas fa-tv"></i>
                <h3>独立演示页面</h3>
                <p>完整的交互式演示环境，展示所有功能特性</p>
                <a href="interactive-demo.html" class="btn">
                    <i class="fas fa-external-link-alt"></i>打开演示
                </a>
            </div>

            <div class="demo-card">
                <i class="fas fa-store"></i>
                <h3>集成模型市场</h3>
                <p>在现有模型市场中体验增强的交互功能</p>
                <a href="models.html" class="btn">
                    <i class="fas fa-shopping-cart"></i>访问市场
                </a>
            </div>
        </div>

        <div class="features">
            <div class="feature">
                <i class="fas fa-mouse-pointer"></i>
                <h4>实时交互</h4>
                <p>点击即时响应，流畅的动画效果</p>
            </div>
            <div class="feature">
                <i class="fas fa-bolt"></i>
                <h4>快速加载</h4>
                <p>优化的性能，快速内容切换</p>
            </div>
            <div class="feature">
                <i class="fas fa-mobile-alt"></i>
                <h4>响应式设计</h4>
                <p>完美适配各种设备屏幕</p>
            </div>
            <div class="feature">
                <i class="fas fa-paint-brush"></i>
                <h4>现代UI</h4>
                <p>精美的视觉设计和用户体验</p>
            </div>
        </div>
    </div>

    <script>
        // 添加页面加载动画
        document.addEventListener('DOMContentLoaded', function() {
            const elements = document.querySelectorAll('.demo-card, .feature');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                
                setTimeout(() => {
                    el.style.transition = 'all 0.5s ease';
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, index * 100);
            });
        });
    </script>
</body>
</html>
