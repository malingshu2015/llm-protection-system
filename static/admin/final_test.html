<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最终模型市场测试</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            color: #333;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .test-button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
        }

        .status.success {
            background: rgba(72, 187, 120, 0.1);
            color: #48bb78;
            border: 2px solid rgba(72, 187, 120, 0.3);
        }

        .status.error {
            background: rgba(245, 101, 101, 0.1);
            color: #f56565;
            border: 2px solid rgba(245, 101, 101, 0.3);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .modal-title {
            color: #333;
            font-size: 1.5rem;
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            padding: 5px;
        }

        .model-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .model-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #e9ecef;
        }

        .model-name {
            font-weight: 600;
            color: #495057;
            margin-bottom: 5px;
        }

        .model-info {
            font-size: 12px;
            color: #6c757d;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-store"></i> 模型市场测试</h1>
            <p>点击下方按钮测试模型市场弹窗功能</p>
        </div>

        <button class="test-button" onclick="openModelMarket()">
            <i class="fas fa-store"></i>
            打开模型市场
        </button>

        <div id="status"></div>
    </div>

    <!-- 模型市场弹窗 -->
    <div class="modal" id="modelModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">
                    <i class="fas fa-store"></i> 模型市场
                </h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalContent">
                <div class="loading">
                    <div class="spinner"></div>
                    正在加载模型...
                </div>
            </div>
        </div>
    </div>

    <script>
        let modal = document.getElementById('modelModal');
        let modalContent = document.getElementById('modalContent');
        let statusDiv = document.getElementById('status');

        function openModelMarket() {
            statusDiv.innerHTML = '<div class="status success">✅ 正在打开模型市场...</div>';
            modal.style.display = 'flex';
            loadModels();
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        async function loadModels() {
            try {
                const response = await fetch('/api/v1/models');
                
                if (response.ok) {
                    const models = await response.json();
                    displayModels(models);
                    statusDiv.innerHTML = '<div class="status success">✅ 成功加载 ' + models.length + ' 个模型</div>';
                } else {
                    throw new Error('API请求失败');
                }
            } catch (error) {
                modalContent.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #721c24;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 48px; margin-bottom: 20px;"></i>
                        <h3>加载失败</h3>
                        <p>${error.message}</p>
                        <p style="margin-top: 10px; font-size: 14px;">请确保后端服务正在运行</p>
                    </div>
                `;
                statusDiv.innerHTML = '<div class="status error">❌ 加载模型失败</div>';
            }
        }

        function displayModels(models) {
            const modelGrid = models.slice(0, 6).map(model => `
                <div class="model-card">
                    <div class="model-name">${model.name}</div>
                    <div class="model-info">
                        <div><i class="fas fa-cube"></i> ${model.framework}</div>
                        <div><i class="fas fa-download"></i> ${model.downloads?.toLocaleString() || 0}</div>
                        <div><i class="fas fa-star"></i> ${model.community_rating || 'N/A'}</div>
                    </div>
                </div>
            `).join('');

            modalContent.innerHTML = `
                <div style="margin-bottom: 20px;">
                    <p style="color: #6c757d;">找到 ${models.length} 个模型，以下是前6个：</p>
                </div>
                <div class="model-grid">
                    ${modelGrid}
                </div>
                <div style="text-align: center; margin-top: 20px; color: #6c757d;">
                    <i class="fas fa-check-circle" style="color: #28a745;"></i>
                    模型市场功能正常！
                </div>
            `;
        }

        // 点击背景关闭弹窗
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                closeModal();
            }
        });

        // ESC键关闭弹窗
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && modal.style.display === 'flex') {
                closeModal();
            }
        });
    </script>
</body>
</html>
