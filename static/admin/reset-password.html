<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - LLM防护系统</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.3);
        }

        .logo i {
            font-size: 40px;
            color: white;
        }

        h1 {
            font-size: 28px;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #718096;
            font-size: 14px;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            gap: 12px;
        }

        .step {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #718096;
            transition: all 0.3s;
        }

        .step.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            transform: scale(1.1);
        }

        .step.completed {
            background: #48bb78;
            color: white;
        }

        .form-step {
            display: none;
        }

        .form-step.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2d3748;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="email"],
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="email"]:focus,
        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #f5576c;
        }

        input[type="text"] {
            text-align: center;
            letter-spacing: 8px;
            font-weight: 600;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 12px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.5);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #cbd5e0;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .password-strength {
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            transition: all 0.3s;
            width: 0;
        }

        .password-hints {
            margin-top: 8px;
            font-size: 12px;
            color: #718096;
        }

        .password-hints li {
            margin-left: 20px;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #f5576c;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="header">
            <div class="logo">
                <i class="fas fa-key"></i>
            </div>
            <h1>重置密码</h1>
            <p class="subtitle">找回您的账户访问权限</p>
        </div>

        <div class="step-indicator">
            <div class="step active" id="step-1">1</div>
            <div class="step" id="step-2">2</div>
            <div class="step" id="step-3">3</div>
        </div>

        <div id="alert-box"></div>

        <!-- 步骤1: 输入邮箱 -->
        <div class="form-step active" id="step1-form">
            <form id="email-form">
                <div class="form-group">
                    <label for="email">邮箱地址</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="your@email.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <button type="submit" class="btn btn-primary" id="send-code-btn">
                    <i class="fas fa-paper-plane"></i> 发送验证码
                </button>
            </form>
        </div>

        <!-- 步骤2: 输入验证码 -->
        <div class="form-step" id="step2-form">
            <form id="code-form">
                <div class="form-group">
                    <label for="code">验证码</label>
                    <input
                        type="text"
                        id="code"
                        name="code"
                        placeholder="000000"
                        maxlength="6"
                        pattern="[0-9]{6}"
                        required
                        autocomplete="off"
                    >
                    <div class="alert alert-info" style="margin-top: 12px;">
                        <i class="fas fa-info-circle"></i>
                        验证码已发送到您的邮箱，请查收(有效期30分钟)
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="verify-code-btn">
                    <i class="fas fa-arrow-right"></i> 下一步
                </button>

                <button type="button" class="btn btn-secondary" onclick="backToStep(1)">
                    <i class="fas fa-arrow-left"></i> 返回上一步
                </button>
            </form>
        </div>

        <!-- 步骤3: 设置新密码 -->
        <div class="form-step" id="step3-form">
            <form id="password-form">
                <div class="form-group">
                    <label for="new-password">新密码</label>
                    <input
                        type="password"
                        id="new-password"
                        name="new-password"
                        placeholder="请输入新密码"
                        required
                        minlength="8"
                    >
                    <div class="password-strength">
                        <div class="password-strength-bar" id="strength-bar"></div>
                    </div>
                    <ul class="password-hints">
                        <li id="hint-length" style="color: #e53e3e;">至少8个字符</li>
                        <li id="hint-upper" style="color: #e53e3e;">包含大写字母</li>
                        <li id="hint-lower" style="color: #e53e3e;">包含小写字母</li>
                        <li id="hint-digit" style="color: #e53e3e;">包含数字</li>
                    </ul>
                </div>

                <div class="form-group">
                    <label for="confirm-password">确认密码</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="再次输入新密码"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary" id="reset-password-btn">
                    <i class="fas fa-check-circle"></i> 重置密码
                </button>
            </form>
        </div>

        <div class="back-link">
            <a href="/static/admin/login.html">
                <i class="fas fa-sign-in-alt"></i> 返回登录
            </a>
        </div>
    </div>

    <script>
        let currentStep = 1;
        let userEmail = '';
        let verificationCode = '';

        // 显示提示信息
        function showAlert(message, type = 'info') {
            const alertBox = document.getElementById('alert-box');
            alertBox.innerHTML = `
                <div class="alert alert-${type}">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
                    ${message}
                </div>
            `;

            if (type !== 'error') {
                setTimeout(() => {
                    alertBox.innerHTML = '';
                }, 3000);
            }
        }

        // 切换步骤
        function goToStep(step) {
            // 隐藏所有步骤
            document.querySelectorAll('.form-step').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.step').forEach(el => {
                el.classList.remove('active', 'completed');
            });

            // 显示当前步骤
            document.getElementById(`step${step}-form`).classList.add('active');
            document.getElementById(`step-${step}`).classList.add('active');

            // 标记已完成的步骤
            for (let i = 1; i < step; i++) {
                document.getElementById(`step-${i}`).classList.add('completed');
            }

            currentStep = step;
        }

        function backToStep(step) {
            goToStep(step);
        }

        // 发送验证码
        async function sendVerificationCode(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            if (!email) {
                showAlert('请输入邮箱地址', 'error');
                return;
            }

            userEmail = email;

            const btn = document.getElementById('send-code-btn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 发送中...';

            try {
                const response = await fetch('/api/v1/auth/send-password-reset-email', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert(data.message, 'success');
                    goToStep(2);
                } else {
                    throw new Error(data.detail || '发送失败');
                }
            } catch (error) {
                showAlert('发送失败: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        // 验证验证码并进入下一步
        async function verifyCode(event) {
            event.preventDefault();

            const code = document.getElementById('code').value.trim();
            if (!code || code.length !== 6) {
                showAlert('请输入6位数字验证码', 'error');
                return;
            }

            verificationCode = code;
            goToStep(3);
        }

        // 检查密码强度
        function checkPasswordStrength(password) {
            let strength = 0;
            const hints = {
                length: password.length >= 8,
                upper: /[A-Z]/.test(password),
                lower: /[a-z]/.test(password),
                digit: /[0-9]/.test(password)
            };

            // 更新提示
            document.getElementById('hint-length').style.color = hints.length ? '#48bb78' : '#e53e3e';
            document.getElementById('hint-upper').style.color = hints.upper ? '#48bb78' : '#e53e3e';
            document.getElementById('hint-lower').style.color = hints.lower ? '#48bb78' : '#e53e3e';
            document.getElementById('hint-digit').style.color = hints.digit ? '#48bb78' : '#e53e3e';

            // 计算强度
            if (hints.length) strength += 25;
            if (hints.upper) strength += 25;
            if (hints.lower) strength += 25;
            if (hints.digit) strength += 25;

            // 更新进度条
            const strengthBar = document.getElementById('strength-bar');
            strengthBar.style.width = strength + '%';

            if (strength < 50) {
                strengthBar.style.background = '#e53e3e';
            } else if (strength < 100) {
                strengthBar.style.background = '#ffc107';
            } else {
                strengthBar.style.background = '#48bb78';
            }

            return hints.length && hints.upper && hints.lower && hints.digit;
        }

        // 重置密码
        async function resetPassword(event) {
            event.preventDefault();

            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (!checkPasswordStrength(newPassword)) {
                showAlert('密码不符合要求', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showAlert('两次输入的密码不一致', 'error');
                return;
            }

            const btn = document.getElementById('reset-password-btn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 重置中...';

            try {
                const response = await fetch('/api/v1/auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: userEmail,
                        code: verificationCode,
                        new_password: newPassword
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('✅ ' + data.message, 'success');

                    // 3秒后跳转到登录页
                    setTimeout(() => {
                        window.location.href = '/static/admin/login.html';
                    }, 3000);
                } else {
                    throw new Error(data.detail || '重置失败');
                }
            } catch (error) {
                showAlert('重置失败: ' + error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 绑定表单提交事件
            document.getElementById('email-form').addEventListener('submit', sendVerificationCode);
            document.getElementById('code-form').addEventListener('submit', verifyCode);
            document.getElementById('password-form').addEventListener('submit', resetPassword);

            // 监听密码输入
            document.getElementById('new-password').addEventListener('input', function(e) {
                checkPasswordStrength(e.target.value);
            });
        });
    </script>
</body>
</html>
