<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>监控中心调试版</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .debug { background: #fff3cd; color: #856404; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; overflow: auto; }
    </style>
</head>
<body>
    <h1>监控中心调试工具</h1>
    <div id="status"></div>
    <div id="log"></div>

    <script>
        const statusDiv = document.getElementById('status');
        const logDiv = document.getElementById('log');

        function addStatus(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = message;
            statusDiv.appendChild(div);
        }

        function addLog(message, data = null) {
            const div = document.createElement('div');
            div.innerHTML = `<strong>${message}</strong>`;
            if (data) {
                const pre = document.createElement('pre');
                pre.textContent = JSON.stringify(data, null, 2);
                div.appendChild(pre);
            }
            logDiv.appendChild(div);
        }

        // 测试步骤
        async function runTests() {
            addStatus('开始测试...', 'info');

            // 1. 检查authManager是否可用
            addStatus('步骤1: 检查authManager', 'debug');
            if (typeof authManager === 'undefined') {
                addStatus('❌ authManager 未定义', 'error');
                addLog('authManager 未定义，检查脚本加载顺序');
            } else {
                addStatus('✅ authManager 已定义', 'success');
                addLog('authManager 对象', {
                    type: typeof authManager,
                    hasInit: typeof authManager.init === 'function',
                    hasCheckAuth: typeof authManager.checkAuth === 'function'
                });
            }

            // 2. 尝试初始化
            addStatus('步骤2: 尝试初始化', 'debug');
            try {
                const result = await authManager.init({
                    userElementId: 'currentUser',
                    autoRefresh: false,
                    onAuthSuccess: (user) => {
                        addStatus('✅ 认证成功回调触发', 'success');
                        addLog('用户信息', user);
                    },
                    onAuthFailure: () => {
                        addStatus('❌ 认证失败回调触发', 'error');
                    }
                });

                addStatus(`初始化结果: ${result}`, result ? 'success' : 'error');
            } catch (error) {
                addStatus(`❌ 初始化错误: ${error.message}`, 'error');
                addLog('错误详情', {
                    message: error.message,
                    stack: error.stack
                });
            }

            // 3. 测试API连接
            addStatus('步骤3: 测试API连接', 'debug');
            try {
                const response = await fetch('/api/v1/metrics');
                if (response.ok) {
                    const data = await response.json();
                    addStatus('✅ API连接正常', 'success');
                    addLog('API响应', data);
                } else {
                    addStatus(`❌ API响应错误: ${response.status}`, 'error');
                }
            } catch (error) {
                addStatus(`❌ API连接错误: ${error.message}`, 'error');
            }

            addStatus('测试完成', 'info');
        }

        // 页面加载完成后开始测试
        document.addEventListener('DOMContentLoaded', async function() {
            addStatus('DOM已加载', 'info');

            // 等待1秒确保所有脚本加载完成
            await new Promise(resolve => setTimeout(resolve, 1000));

            await runTests();
        });
    </script>

    <!-- 按照原页面的顺序加载脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/admin/js/auth-check.js"></script>
</body>
</html>
