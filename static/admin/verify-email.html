<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮箱验证 - LLM防护系统</title>

    <!-- 认证模块 -->
    <script src="/static/admin/js/auth-check.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .verification-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .logo i {
            font-size: 40px;
            color: white;
        }

        h1 {
            font-size: 28px;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #718096;
            font-size: 14px;
        }

        .verification-status {
            background: #f7fafc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .status-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .status-text {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .user-email {
            color: #667eea;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2d3748;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            text-align: center;
            letter-spacing: 8px;
            font-weight: 600;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 12px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #cbd5e0;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .timer {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-top: 12px;
        }

        .timer.expired {
            color: #e53e3e;
        }

        .resend-link {
            text-align: center;
            margin-top: 20px;
        }

        .resend-link button {
            background: none;
            border: none;
            color: #667eea;
            text-decoration: underline;
            cursor: pointer;
            font-size: 14px;
        }

        .resend-link button:hover {
            color: #764ba2;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="verification-container">
        <div class="header">
            <div class="logo">
                <i class="fas fa-envelope-open-text"></i>
            </div>
            <h1>邮箱验证</h1>
            <p class="subtitle">请输入发送到您邮箱的验证码</p>
        </div>

        <div class="verification-status" id="status-section">
            <div class="status-icon">
                <i class="fas fa-paper-plane" style="color: #667eea;"></i>
            </div>
            <div class="status-text">
                验证邮件已发送到<br>
                <span class="user-email" id="user-email">loading...</span>
            </div>
            <div class="timer" id="timer">验证码有效期: 30分钟</div>
        </div>

        <div id="alert-box"></div>

        <form id="verification-form">
            <div class="form-group">
                <label for="code">验证码</label>
                <input
                    type="text"
                    id="code"
                    name="code"
                    placeholder="000000"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    required
                    autocomplete="off"
                >
            </div>

            <button type="submit" class="btn btn-primary" id="verify-btn">
                <i class="fas fa-check-circle"></i> 验证邮箱
            </button>
        </form>

        <div class="resend-link">
            <button id="resend-btn" disabled>
                <i class="fas fa-redo"></i>
                <span id="resend-text">60秒后可重新发送</span>
            </button>
        </div>

        <div class="back-link">
            <a href="/static/admin/monitor.html">
                <i class="fas fa-arrow-left"></i> 返回首页
            </a>
        </div>
    </div>

    <script>
        let currentUser = null;
        let resendTimer = null;
        let resendCountdown = 60;

        // 显示提示信息
        function showAlert(message, type = 'info') {
            const alertBox = document.getElementById('alert-box');
            alertBox.innerHTML = `
                <div class="alert alert-${type}">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
                    ${message}
                </div>
            `;

            // 3秒后自动隐藏(除了错误信息)
            if (type !== 'error') {
                setTimeout(() => {
                    alertBox.innerHTML = '';
                }, 3000);
            }
        }

        // 开始重发倒计时
        function startResendCountdown() {
            resendCountdown = 60;
            const resendBtn = document.getElementById('resend-btn');
            const resendText = document.getElementById('resend-text');

            resendBtn.disabled = true;

            resendTimer = setInterval(() => {
                resendCountdown--;
                resendText.textContent = `${resendCountdown}秒后可重新发送`;

                if (resendCountdown <= 0) {
                    clearInterval(resendTimer);
                    resendBtn.disabled = false;
                    resendText.textContent = '重新发送验证码';
                }
            }, 1000);
        }

        // 重新发送验证邮件
        async function resendVerificationEmail() {
            try {
                const resendBtn = document.getElementById('resend-btn');
                resendBtn.disabled = true;

                const response = await authManager.authenticatedFetch('/api/v1/auth/send-verification-email', {
                    method: 'POST'
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert(data.message, 'success');
                    startResendCountdown();
                } else {
                    throw new Error(data.detail || '发送失败');
                }
            } catch (error) {
                showAlert('重新发送失败: ' + error.message, 'error');
                document.getElementById('resend-btn').disabled = false;
            }
        }

        // 验证邮箱
        async function verifyEmail(event) {
            event.preventDefault();

            const code = document.getElementById('code').value.trim();

            if (!code || code.length !== 6) {
                showAlert('请输入6位数字验证码', 'error');
                return;
            }

            const verifyBtn = document.getElementById('verify-btn');
            const originalText = verifyBtn.innerHTML;
            verifyBtn.disabled = true;
            verifyBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 验证中...';

            try {
                const response = await authManager.authenticatedFetch('/api/v1/auth/verify-email', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: currentUser.email,
                        code: code
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('✅ ' + data.message, 'success');

                    // 更新状态显示
                    document.getElementById('status-section').innerHTML = `
                        <div class="status-icon">
                            <i class="fas fa-check-circle" style="color: #28a745;"></i>
                        </div>
                        <div class="status-text" style="color: #28a745;">
                            邮箱验证成功!
                        </div>
                    `;

                    // 3秒后跳转到首页
                    setTimeout(() => {
                        window.location.href = '/static/admin/monitor.html';
                    }, 3000);
                } else {
                    throw new Error(data.detail || '验证失败');
                }
            } catch (error) {
                showAlert('验证失败: ' + error.message, 'error');
                verifyBtn.disabled = false;
                verifyBtn.innerHTML = originalText;
            }
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', async function() {
            // 认证检查
            const authenticated = await authManager.init({
                autoRefresh: true,
                onAuthSuccess: async (user) => {
                    currentUser = user;

                    // 显示用户邮箱
                    document.getElementById('user-email').textContent = user.email;

                    // 检查是否已验证
                    if (user.is_verified) {
                        showAlert('您的邮箱已经验证过了', 'info');

                        document.getElementById('status-section').innerHTML = `
                            <div class="status-icon">
                                <i class="fas fa-check-circle" style="color: #28a745;"></i>
                            </div>
                            <div class="status-text" style="color: #28a745;">
                                邮箱已验证
                            </div>
                        `;

                        document.getElementById('verification-form').style.display = 'none';
                        document.querySelector('.resend-link').style.display = 'none';
                    } else {
                        // 开始倒计时
                        startResendCountdown();
                    }
                }
            });

            if (!authenticated) {
                return;
            }

            // 绑定表单提交事件
            document.getElementById('verification-form').addEventListener('submit', verifyEmail);

            // 绑定重发按钮事件
            document.getElementById('resend-btn').addEventListener('click', resendVerificationEmail);
        });
    </script>
</body>
</html>
