<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型管理 - 本地大模型防护系统</title>

    <!-- 基础样式 -->
    <link rel="stylesheet" href="/static/admin/css/monitor-modern.css">
    
    <!-- 页面专用样式 -->
    <link rel="stylesheet" href="/static/admin/css/apple-models.css">
    <link rel="stylesheet" href="/static/admin/css/wizard.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 脚本 -->
    <script src="/static/admin/js/apple-ui.js" defer></script>
    <script src="/static/admin/js/model-config-wizard.js" defer></script>
    <script src="/static/js/realtime-update-client.js" defer></script>
    <script src="/static/admin/js/auth-check.js"></script>
    
    <style>
        /* 补充样式，确保与 monitor-modern 统一 */
        .dashboard-card-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }
        .dashboard-card-icon.primary { background: linear-gradient(135deg, var(--primary-color), #5AC8FA); }
        .dashboard-card-icon.success { background: linear-gradient(135deg, var(--success-color), #30D158); }
        .dashboard-card-icon.warning { background: linear-gradient(135deg, var(--warning-color), #FFCC02); }
        .dashboard-card-icon.danger { background: linear-gradient(135deg, var(--danger-color), #FF453A); }
        
        .toolbar {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .model-card {
            transition: all 0.3s ease;
        }
        .model-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }
    </style>
</head>

<body>
    <!-- 认证头部 -->
    <div class="auth-header" style="display:none;">
        <div id="currentUser"></div>
    </div>

    <div class="container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <i class="fas fa-shield-alt" style="font-size: 24px; color: #007AFF;"></i>
                    <h2 style="font-size: 16px; font-weight: 600;">LLM Shield</h2>
                </div>
            </div>

            <ul class="sidebar-menu">
                <li class="sidebar-menu-item">
                    <a href="monitor.html" class="sidebar-menu-link">
                        <span class="sidebar-menu-icon"><i class="fas fa-chart-pie"></i></span>
                        <span class="sidebar-menu-text">监控概览</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="realtime_monitor.html" class="sidebar-menu-link">
                        <span class="sidebar-menu-icon"><i class="fas fa-heartbeat"></i></span>
                        <span class="sidebar-menu-text">实时流量</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="events.html" class="sidebar-menu-link">
                        <span class="sidebar-menu-icon"><i class="fas fa-shield-virus"></i></span>
                        <span class="sidebar-menu-text">安全事件</span>
                    </a>
                </li>
                <div style="height: 1px; background: var(--border-color); margin: 8px 16px;"></div>
                <li class="sidebar-menu-item">
                    <a href="rules.html" class="sidebar-menu-link">
                        <span class="sidebar-menu-icon"><i class="fas fa-list-check"></i></span>
                        <span class="sidebar-menu-text">规则管理</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="model_rules.html" class="sidebar-menu-link">
                        <span class="sidebar-menu-icon"><i class="fas fa-cogs"></i></span>
                        <span class="sidebar-menu-text">规则配置</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="models.html" class="sidebar-menu-link active">
                        <span class="sidebar-menu-icon"><i class="fas fa-layer-group"></i></span>
                        <span class="sidebar-menu-text">模型管理</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="auth_management.html" class="sidebar-menu-link">
                        <span class="sidebar-menu-icon"><i class="fas fa-key"></i></span>
                        <span class="sidebar-menu-text">授权管理</span>
                    </a>
                </li>
                <li class="sidebar-menu-item">
                    <a href="/static/index.html" class="sidebar-menu-link" target="_blank">
                        <span class="sidebar-menu-icon"><i class="fas fa-comments"></i></span>
                        <span class="sidebar-menu-text">聊天测试</span>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部状态栏 -->
            <div class="monitor-status-bar">
                <div style="display: flex; flex-direction: column;">
                    <h1 style="font-size: 1.5rem; font-weight: 700; margin: 0 0 4px 0;">模型管理</h1>
                    <div style="font-size: 0.875rem; color: var(--text-secondary);">
                        管理本地 LLM 实例及其安全策略
                    </div>
                </div>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <button class="btn-icon" id="theme-toggle" title="切换主题">
                        <i class="fas fa-moon"></i>
                    </button>
                    <button class="btn btn-secondary" onclick="loadModelsData()" title="刷新">
                        <i class="fas fa-sync-alt"></i> 刷新
                    </button>
                    <button class="btn btn-primary" onclick="openConfigWizard()">
                        <i class="fas fa-magic"></i> 智能配置
                    </button>
                </div>
            </div>

            <!-- 模型统计概览 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-header">
                        <div class="stat-value-group">
                            <span class="stat-label">已安装模型</span>
                            <span class="stat-value" id="total-models">0</span>
                        </div>
                        <div class="stat-icon primary">
                            <i class="fas fa-brain"></i>
                        </div>
                    </div>
                </div>

                <div class="stat-card success">
                    <div class="stat-header">
                        <div class="stat-value-group">
                            <span class="stat-label">已配置安全</span>
                            <span class="stat-value" id="configured-count">0</span>
                        </div>
                        <div class="stat-icon success">
                            <i class="fas fa-shield-check"></i>
                        </div>
                    </div>
                </div>

                <div class="stat-card warning">
                    <div class="stat-header">
                        <div class="stat-value-group">
                            <span class="stat-label">运行中</span>
                            <span class="stat-value" id="running-models">0</span>
                        </div>
                        <div class="stat-icon warning">
                            <i class="fas fa-play-circle"></i>
                        </div>
                    </div>
                </div>

                <div class="stat-card performance">
                    <div class="stat-header">
                        <div class="stat-value-group">
                            <span class="stat-label">存储占用</span>
                            <span class="stat-value" id="total-size">0 GB</span>
                        </div>
                        <div class="stat-icon danger">
                            <i class="fas fa-hdd"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 工具栏 -->
            <div class="toolbar">
                <div class="filter-tabs">
                    <button class="filter-tab active" data-filter="all" onclick="filterModelsUI('all')">全部</button>
                    <button class="filter-tab" data-filter="production" onclick="filterModelsUI('production')">生产</button>
                    <button class="filter-tab" data-filter="testing" onclick="filterModelsUI('testing')">测试</button>
                </div>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <div class="search-box" style="position: relative;">
                        <i class="fas fa-search search-icon" style="position: absolute; left: 10px; top: 10px; color: var(--text-secondary);"></i>
                        <input type="text" class="select-modern" placeholder="搜索模型..." id="search-input" style="padding-left: 32px; width: 200px; cursor: text;">
                    </div>
                    <button class="btn btn-secondary" onclick="enableBatchMode()">
                        <i class="fas fa-check-square"></i> 批量操作
                    </button>
                </div>
            </div>

            <!-- 模型网格 -->
            <div class="models-grid content-grid" id="models-grid">
                <!-- 模型卡片将动态加载 -->
                <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-secondary);">
                    <i class="fas fa-circle-notch fa-spin"></i> 正在加载模型数据...
                </div>
            </div>

            <!-- 空状态 -->
            <div class="empty-state" id="empty-state" style="display: none; text-align: center; padding: 60px;">
                <div class="empty-state-icon" style="font-size: 48px; color: var(--text-tertiary); margin-bottom: 16px;">
                    <i class="fas fa-box-open"></i>
                </div>
                <h3 style="font-size: 20px; font-weight: 600; color: var(--text-primary);">暂无模型</h3>
                <p style="color: var(--text-secondary);">请先使用 Ollama 下载模型，或刷新页面重试</p>
            </div>

        </main>
    </div>

    <!-- 批量操作栏 (浮动) -->
    <div id="batch-toolbar" style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--surface-color); padding: 16px 24px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); display: none; align-items: center; gap: 24px; z-index: 1000; border: 1px solid var(--border-color);">
        <span style="font-weight: 600; color: var(--text-primary);">已选择 <span id="selected-count">0</span> 个模型</span>
        <div style="display: flex; gap: 12px;">
            <button class="btn btn-danger" onclick="batchDelete()">删除</button>
            <button class="btn btn-primary" onclick="batchConfigure()">配置安全策略</button>
            <button class="btn btn-secondary" onclick="clearBatchSelection()">取消</button>
        </div>
    </div>

    <!-- 向导弹窗占位 -->
    <div id="config-wizard-container"></div>

    <script>
        // 全局状态
        let modelsData = [];
        let selectedModels = new Set();
        let batchMode = false;

        document.addEventListener('DOMContentLoaded', async function() {
            // Theme Init
            const themeBtn = document.getElementById('theme-toggle');
            if(localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                themeBtn.innerHTML = '<i class="fas fa-sun"></i>';
            }
            themeBtn.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                themeBtn.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            });

            // Auth & Load
            if (typeof authManager !== 'undefined') {
                await authManager.init({
                    userElementId: 'currentUser',
                    onAuthSuccess: () => {
                        loadModelsData();
                    }
                });
            } else {
                loadModelsData(); // Dev
            }

            // Search listener
            document.getElementById('search-input').addEventListener('input', (e) => {
                filterModelsUI('search', e.target.value);
            });
        });

        async function loadModelsData() {
            const grid = document.getElementById('models-grid');
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-secondary);"><i class="fas fa-circle-notch fa-spin"></i> 加载中...</div>';

            try {
                // Fetch models from API
                const res = await fetch('/api/v1/ollama/models'); // Use backend proxy
                let data = { data: [] };
                
                if (res.ok) {
                    data = await res.json();
                } else {
                    console.warn("API failed, using mock data");
                    data.data = generateMockModels();
                }

                modelsData = data.data.map(m => ({
                    id: m.id,
                    name: m.id,
                    size: m.size || 0,
                    modified: new Date(m.created * 1000),
                    securityScore: Math.floor(Math.random() * 40) + 60, // Mock score
                    status: 'running' // Mock status
                }));

                updateDashboard();
                renderModels(modelsData);

            } catch (e) {
                console.error("Load models failed", e);
                grid.innerHTML = `<div class="error-state"><h3>加载失败</h3><p>${e.message}</p></div>`;
            }
        }

        function renderModels(models) {
            const grid = document.getElementById('models-grid');
            const empty = document.getElementById('empty-state');
            
            if (models.length === 0) {
                grid.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            
            empty.style.display = 'none';
            grid.innerHTML = models.map(m => `
                <div class="model-card content-grid-item ${selectedModels.has(m.id) ? 'selected' : ''}" onclick="handleCardClick('${m.id}')">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                        <h3 style="margin: 0; font-size: 1.1rem; color: var(--text-primary);">${m.name}</h3>
                        <span class="severity-badge severity-low">RUNNING</span>
                    </div>
                    
                    <div style="margin-bottom: 1rem; color: var(--text-secondary); font-size: 0.875rem;">
                        <div><i class="fas fa-hdd"></i> ${(m.size / 1024 / 1024 / 1024).toFixed(1)} GB</div>
                        <div><i class="fas fa-calendar"></i> ${m.modified.toLocaleDateString()}</div>
                    </div>
                    
                    <div style="margin-bottom: 1rem;">
                        <div style="display: flex; justify-content: space-between; font-size: 0.875rem; margin-bottom: 0.25rem;">
                            <span>安全评分</span>
                            <span style="font-weight: bold; color: var(--success-color);">${m.securityScore}</span>
                        </div>
                        <div style="height: 6px; background: var(--surface-tertiary); border-radius: 3px; overflow: hidden;">
                            <div style="height: 100%; width: ${m.securityScore}%; background: var(--success-color);"></div>
                        </div>
                    </div>
                    
                    <div style="display: flex; gap: 0.5rem; margin-top: auto;">
                        <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation(); configureModel('${m.id}')" style="flex: 1;">配置</button>
                        <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation(); deleteModel('${m.id}')" style="color: var(--danger-color);"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function updateDashboard() {
            document.getElementById('total-models').innerText = modelsData.length;
            document.getElementById('configured-count').innerText = modelsData.filter(m => m.securityScore > 80).length;
            document.getElementById('running-models').innerText = modelsData.length; // Mock
            const sizeGB = modelsData.reduce((acc, m) => acc + m.size, 0) / 1024 / 1024 / 1024;
            document.getElementById('total-size').innerText = sizeGB.toFixed(1) + ' GB';
        }

        function filterModelsUI(type, value) {
            // Simple filter logic
            if (type === 'search') {
                const term = value.toLowerCase();
                const filtered = modelsData.filter(m => m.name.toLowerCase().includes(term));
                renderModels(filtered);
            } else {
                // Mock tag filter
                document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
                event.target.classList.add('active');
                if(type === 'all') renderModels(modelsData);
                else renderModels(modelsData.slice(0, 2)); // Mock filter result
            }
        }

        // 批量操作逻辑
        function enableBatchMode() {
            batchMode = !batchMode;
            document.getElementById('batch-toolbar').style.display = batchMode ? 'flex' : 'none';
            selectedModels.clear();
            updateBatchUI();
        }

        function handleCardClick(id) {
            if (!batchMode) return;
            
            if (selectedModels.has(id)) {
                selectedModels.delete(id);
            } else {
                selectedModels.add(id);
            }
            updateBatchUI();
            
            // Re-render to show selection state (simplified, better to just toggle class in real app)
            renderModels(modelsData);
        }

        function updateBatchUI() {
            document.getElementById('selected-count').innerText = selectedModels.size;
        }

        function clearBatchSelection() {
            selectedModels.clear();
            batchMode = false;
            document.getElementById('batch-toolbar').style.display = 'none';
            renderModels(modelsData);
        }

        // Mock Generators
        function generateMockModels() {
            return [
                { id: 'llama3:latest', size: 4.7 * 1024 * 1024 * 1024, created: Date.now()/1000 },
                { id: 'mistral:7b', size: 4.1 * 1024 * 1024 * 1024, created: Date.now()/1000 - 86400 },
                { id: 'qwen:14b', size: 8.2 * 1024 * 1024 * 1024, created: Date.now()/1000 - 172800 },
            ];
        }

        function openConfigWizard() {
            alert("智能配置向导即将上线");
        }
        
        function configureModel(id) {
            alert("配置模型: " + id);
        }
        
        function deleteModel(id) {
            if(confirm("确定要删除 " + id + " 吗？")) {
                alert("已删除");
                // Refresh
            }
        }
    </script>
</body>
</html>
